name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Four independent jobs, deliberately not chained: they fail for different
# reasons, and running them in parallel means one slow job does not hide
# the others' results.
jobs:
  backend:
    name: backend (Java 21 + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: basketball_predictor
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Holds the job until Postgres actually accepts connections, which
        # is the same gap the compose healthcheck closes: Hikari fails fast
        # against a database that is merely started.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No -DskipTests here, unlike every local build and the backend
      # Dockerfile. contextLoads starts the whole Spring context and needs a
      # live database; the service container above is the first environment
      # where that has been true automatically.
      - name: Build and test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PASSWORD: postgres
        run: mvn -B clean verify

  frontend:
    name: frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 20 to match frontend/Dockerfile's build stage, not whatever is
      # installed locally.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Mirrors frontend/Dockerfile. setup-node installs whatever npm ships
      # with the runner image, which is not necessarily the version that
      # generated package-lock.json - and npm ci then fails outright on the
      # resulting lockfile mismatch ("Missing: yaml@2.9.0 from lock file").
      - name: Pin npm to match lock file
        working-directory: frontend
        run: npm install -g npm@11.16.0

      - name: Install
        working-directory: frontend
        run: npm ci

      # --watchAll=false because create-react-app's runner defaults to watch
      # mode, which never exits and would hang the job until it times out.
      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false

      # Actions sets CI=true, which also makes this build fail on warnings.
      - name: Production build
        working-directory: frontend
        run: npm run build

  inference-service:
    name: inference-service (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.14 to match inference-service/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: inference-service/requirements.txt

      - name: Install
        run: pip install -r inference-service/requirements.txt

      # A real boot, not an import check. Two bugs this project already hit
      # only show up here: a missing scikit-learn (xgboost's sklearn API
      # raises on XGBClassifier(), so models_loaded never reaches 7) and a
      # broken uvicorn entry point (nothing ever answers on the port).
      # Needs the committed games_final.csv and the 7 model .json files.
      - name: Boot the service and check health
        working-directory: inference-service
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          UVICORN_PID=$!

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health -o health.json; then break; fi
            sleep 2
          done

          if [ ! -f health.json ]; then
            echo "Service never answered on :8000. uvicorn output:"
            cat uvicorn.log
            exit 1
          fi

          cat health.json
          python -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok', h; assert h['models_loaded'] == 7, h; print('health OK:', h)"

          kill "$UVICORN_PID"

  docker-build:
    name: docker build (all images)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build only. This asks whether every Dockerfile still produces a
      # valid image, which is a different question from whether the stack
      # runs - that one is answered by `docker compose up` locally.
      - name: Build all images
        run: docker compose build
