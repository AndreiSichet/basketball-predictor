name: THROWAWAY - can a hosted runner reach nba_api?

# A ONE-TIME DIAGNOSTIC. Delete this file once it has answered its question.
#
# Everything about running the retrain job on GitHub-hosted runners depends
# on an assumption nobody has tested: that the NBA's stats endpoints answer
# a datacenter IP the same way they answer a home connection. They are known
# to treat the two differently, and a local test proves nothing about it.
#
# Deliberately workflow_dispatch only. This is not part of any pipeline and
# must never run on a schedule or a push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reach-nba-api:
    name: three real calls, one per ingestion path
    runs-on: ubuntu-latest
    # Generous but bounded: if nba_api is being throttled rather than
    # blocked outright, that shows up as hanging, and a hung job that runs
    # for six hours tells you less than one that fails in ten minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        # No lfs: true. This job reads no repository data - the point is the
        # network, and pulling 77 MB of LFS to find that out would be its
        # own small waste of the very bandwidth being budgeted elsewhere.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install nba_api only
        # Pinned to the version data-pipeline/requirements.txt pins, so this
        # tests the client actually in use rather than whatever is newest.
        run: pip install nba_api==1.11.4

      - name: Call all three endpoints the pipeline depends on
        run: |
          python - <<'PY'
          import time, traceback

          # One call per ingestion path, cheapest first. Each is a real call
          # against the live API - there is no offline mode that would tell
          # us anything about datacenter access.
          #
          # The third matters most: fetch_player_boxscores.py makes 13,199
          # of these on a fresh checkout, so if this one is blocked or slow
          # the hosted-runner plan is finished regardless of the others.
          checks = []

          def attempt(name, fn):
              start = time.time()
              try:
                  frame = fn()
                  elapsed = time.time() - start
                  ok = frame is not None and len(frame) > 0
                  print(f"\n[{name}] {'OK' if ok else 'EMPTY RESPONSE'} "
                        f"in {elapsed:.1f}s, {len(frame)} rows")
                  print(frame.head(3).to_string()[:600])
                  checks.append((name, ok, elapsed, ""))
              except Exception as error:
                  elapsed = time.time() - start
                  print(f"\n[{name}] FAILED in {elapsed:.1f}s")
                  traceback.print_exc()
                  checks.append((name, False, elapsed, f"{type(error).__name__}: {error}"))

          from nba_api.stats.endpoints import (
              scheduleleaguev2, leaguegamefinder, boxscoretraditionalv3)

          # 1. What /schedule uses - the fixture cache depends on this.
          attempt("ScheduleLeagueV2", lambda: scheduleleaguev2.ScheduleLeagueV2(
              season="2026-27", league_id="00", timeout=45).get_data_frames()[0])

          # 2. What fetch_games.py uses - 11 calls on a full pipeline run.
          attempt("LeagueGameFinder", lambda: leaguegamefinder.LeagueGameFinder(
              season_nullable="2025-26", league_id_nullable="00",
              season_type_nullable="Regular Season", timeout=45).get_data_frames()[0])

          # 3. What fetch_player_boxscores.py uses - 13,199 calls on a fresh
          #    checkout. A real game id, zero-padded: str(21500001) drops the
          #    leading zeros and the endpoint answers with an empty frame
          #    rather than an error.
          attempt("BoxScoreTraditionalV3", lambda: boxscoretraditionalv3
                  .BoxScoreTraditionalV3(game_id="0022500001", timeout=45)
                  .player_stats.get_data_frame())

          print("\n" + "=" * 70)
          print("VERDICT")
          print("=" * 70)
          for name, ok, elapsed, err in checks:
              print(f"  {'PASS' if ok else 'FAIL'}  {name:<24}{elapsed:>6.1f}s  {err}")

          reachable = all(ok for _, ok, _, _ in checks)
          print(f"\n  nba_api usable from a GitHub-hosted runner: {reachable}")
          if not reachable:
              print("  -> hosted runners are out; use a self-hosted runner.")
              raise SystemExit(1)

          slowest = max(e for _, _, e, _ in checks)
          print(f"  slowest single call: {slowest:.1f}s")
          print(f"  extrapolated to 13,199 box-score calls at 1/s: "
                f"~{13199 / 3600:.1f}h of pure rate-limited fetching")
          print("  (a GitHub-hosted job is capped at 6 hours)")
          PY
