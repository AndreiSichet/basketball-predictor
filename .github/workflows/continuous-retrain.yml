name: Continuous retraining

# Retrains the seven team-level models when enough new games have arrived,
# and opens a pull request only if the promotion gate passes. It never
# deploys anything by itself - merging is a human decision.
#
# RUNS ON A SELF-HOSTED RUNNER, and that is not a preference. A
# GitHub-hosted runner starts from an empty disk, and
# build_player_rolling_minutes.py reads all 13,199 files in
# data/raw/player_boxscores/ - which are gitignored. A hosted run would
# therefore re-fetch every one of them at the pipeline's 1 request/second
# ceiling: roughly 3.7 hours against a 6-hour job cap, every single week,
# and 13,199 calls at the NBA each time. The whole skip-and-resume design
# of the ingestion scripts assumes a disk that persists. Only a self-hosted
# runner gives it one.
#
# It also sidesteps two other problems rather than mitigating them: no LFS
# pull at all (the repo's one 76.8 MB object is already checked out), and
# the calls originate from the same connection that has already made tens
# of thousands of successful nba_api requests.
#
# EVERY STEP USES shell: powershell - Windows PowerShell 5.1 - matching the
# shell this project is driven with everywhere else, and matching what the
# runner machine actually has. NOT pwsh: that is PowerShell 7+, which is not
# installed here, and every step would fail to launch. If PowerShell 7 is
# ever installed, `powershell` -> `pwsh` is the only change needed; the
# command bodies below are written to 5.1's constraints, which are a strict
# subset of 7's.
#
# 5.1 specifically means: no `&&` or `||` chaining, no ternary, and
# Out-File/Set-Content need an explicit -Encoding utf8 or they write ANSI.

on:
  schedule:
    # 06:00 UTC Monday. Weekly is the cadence; the script itself decides
    # whether there is actually enough new data to be worth retraining, so
    # most firings during the season - and all of them during the offseason
    # - will exit in seconds having done nothing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Retraining competes for the machine's CPU and disk. Two of these running
# at once would fight over the same data directory as well.
concurrency:
  group: continuous-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Check out, WITHOUT wiping the local data corpus
        uses: actions/checkout@v4
        with:
          # clean: false IS LOAD-BEARING. actions/checkout defaults to
          # clean: true, which runs `git clean -ffdx` - and the -x removes
          # IGNORED files. data/raw/ is gitignored, so the default would
          # delete 61 MB across 39,594 files at the start of every run and
          # reintroduce the exact cold-start problem self-hosting exists to
          # avoid. Silently, visible only as a job that suddenly takes hours.
          clean: false
          # lfs: true IS EQUALLY LOAD-BEARING, and leaving it out is what
          # broke the first real run. Exactly one file here is LFS-tracked -
          # player_boxscores_with_rolling.csv - and without this flag
          # checkout writes the ~130-byte POINTER STUB in its place instead
          # of the 77 MB CSV. build_player_rolling_minutes.py's ROLL10_MIN
          # regression guard reads that file and died with
          #
          #   ValueError: Usecols do not match columns, columns expected
          #   but not found: ['ROLL10_MIN', 'PLAYER_ID', 'GAME_ID']
          #
          # which reads like a schema problem and is actually a missing
          # file. Third occurrence of the bug class in CLAUDE.md section 4's
          # standing rule, and the second where the symptom was a malformed
          # CSV rather than an absent one.
          #
          # The comment that used to sit here argued the opposite: that the
          # working copy already holds the object, so pulling it again would
          # spend LFS bandwidth. The premise was true and the conclusion did
          # not follow - checkout rewrites the working copy from the index
          # regardless of what was there before.
          #
          # No bandwidth surprise either way. ci.yml already sets this on
          # both jobs that read the file, so it is fetched on every push
          # anyway, and .git/lfs survives between runs here, so the pull
          # resolves from the local cache rather than the network.
          lfs: true

      - name: Force-refresh LFS content
        shell: powershell
        run: |
          # BELT AND BRACES OVER lfs: true, not a substitute for it, and the
          # reason is clean: false. Checkout only smudges a file it thinks
          # needs it; a working tree that ALREADY holds a pointer stub from
          # a previous run can look up to date against the index, so the
          # stub survives and the next reader gets a 130-byte CSV. That is
          # precisely how the last failure stayed invisible.
          #
          # git lfs pull = fetch + checkout, and its checkout half replaces
          # every file whose working-tree content is still a pointer,
          # unconditionally. It is a no-op costing seconds when the content
          # is already real.
          #
          # Requires git-lfs on the runner's PATH. It is bundled with Git
          # for Windows, so it is present wherever actions/checkout worked.
          $ErrorActionPreference = 'Continue'
          git lfs pull
          Write-Host "git lfs pull exited $LASTEXITCODE"

      # NO actions/setup-python STEP HERE, deliberately.
      #
      # It was removed rather than fixed. On a self-hosted runner the machine
      # already has the Python this project is pinned against, and installing
      # a second one would mean the workflow trains with a different
      # interpreter than every number in CLAUDE.md was produced on.
      #
      # Its cache: pip option had already failed for a related reason: it
      # shells out to `pip cache dir`, and a runner installed as a Windows
      # service inherits only the SYSTEM PATH, not the user-level PATH a
      # normal Python install writes itself into.
      #
      # That is the same trap twice, so the assumption underneath - "the
      # host's Python is visible to the service" - is checked below rather
      # than relied on. It is cheap to check and expensive to assume: the
      # service account's PATH is genuinely different from an interactive
      # terminal's, and both failures so far looked fine when tested by hand.
      - name: Verify host Python is visible to this service
        shell: powershell
        run: |
          # where.exe rather than just --version: WHICH python resolved is
          # the actual question. A service picking up a different
          # interpreter than the interactive shell is the failure mode being
          # ruled out, and that is invisible from a version number alone.
          where.exe python
          python --version
          python -c "import ctypes; print('ctypes OK')"

      - name: Install the pinned pipeline and training dependencies
        shell: powershell
        run: |
          # python -m pip, never a bare `pip`. The pip shim is a separate
          # executable in Scripts/ and needs its own PATH entry; going
          # through the interpreter that the step above just verified means
          # there is exactly one thing that has to resolve, and the packages
          # land in that interpreter rather than whichever pip won a PATH
          # race. Same reason cache: pip failed - it shelled out to a bare
          # `pip cache dir`.
          python -m pip install --upgrade pip
          python -m pip install -r data-pipeline/requirements.txt
          python -m pip install -r ml-training/requirements.txt

      - name: Confirm the data corpus survived checkout
        shell: powershell
        run: |
          # If this reports a small number, clean: false is not working and
          # the next step is about to spend hours re-fetching. Better to say
          # so here than to discover it from a job duration.
          $files = Get-ChildItem 'data-pipeline/data/raw/player_boxscores/*.csv' -ErrorAction SilentlyContinue
          $count = @($files).Count
          Write-Host "player box scores on disk: $count"
          if ($count -lt 1000) {
            Write-Host "::warning::Only $count box-score files present. Ingestion will re-fetch the rest, which takes hours. Check that the runner's work directory persists and that checkout is not cleaning ignored files."
          }

          # The LFS-tracked file, checked by SIZE rather than existence,
          # because the failure mode is a file that exists and is wrong: a
          # ~130-byte pointer stub where 77 MB belongs. pandas then reports
          # it as missing COLUMNS, which reads like a schema change and sent
          # the last investigation the wrong way entirely.
          #
          # A hard failure, not a warning. There is no useful work left to
          # do - the very first pipeline step reads this file.
          $rolling = 'data-pipeline/data/processed/player_boxscores_with_rolling.csv'
          $size = (Get-Item $rolling -ErrorAction SilentlyContinue).Length
          Write-Host "player_boxscores_with_rolling.csv: $size bytes"
          if ($size -lt 1MB) {
            Write-Host "::error::$rolling is $size bytes - an LFS pointer stub, not the real file. lfs: true and git lfs pull both failed to resolve it."
            exit 1
          }

      - name: Retrain and run the promotion gate
        id: retrain
        shell: powershell
        # The script exits 1 when the gate refuses. That is a correct,
        # expected outcome - not a broken job - so the step must not fail
        # the run on it. The outcomes are told apart below.
        continue-on-error: true
        run: |
          # Native tools write progress to stderr, and GitHub runs this
          # shell with ErrorActionPreference = Stop, which would turn
          # ordinary log lines into a thrown error. 5.1 wraps native stderr
          # in ErrorRecords, so this has to be relaxed explicitly.
          $ErrorActionPreference = 'Continue'

          # Clear any candidates left by a previous run, so "did this run
          # produce models" is answerable by looking at the directory. On a
          # persistent runner last week's output really is still sitting
          # there, unlike a hosted runner where the disk starts empty.
          if (Test-Path 'ml-training/models_candidate') {
            Remove-Item 'ml-training/models_candidate' -Recurse -Force
          }

          python ml-training/continuous_retrain.py --min-new-games 100 2>&1 |
            Tee-Object -FilePath retrain-output.txt

          # $LASTEXITCODE is the native process's code and survives the
          # pipeline. $? does not - 5.1 sets it false whenever a native
          # command wrote anything to stderr, even on a clean exit.
          $code = $LASTEXITCODE
          Write-Host "continuous_retrain.py exited $code"
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Work out which of the three outcomes happened
        id: outcome
        shell: powershell
        run: |
          $code = '${{ steps.retrain.outputs.exit_code }}'
          $models = @(Get-ChildItem 'ml-training/models_candidate/*.json' -ErrorAction SilentlyContinue |
                      Where-Object { $_.Name -ne 'trained_through.json' }).Count

          # FOUR outcomes, deliberately distinguished rather than collapsed.
          # Exit code alone cannot separate "nothing to do" from "promoted" -
          # the script returns 0 for both - so the candidate directory is
          # what tells those two apart.
          #
          # 'error' USED TO BE UNREACHABLE IN PRACTICE. An unhandled Python
          # exception exits 1, the same code as an honest gate refusal, so a
          # crash was reported below as "candidate REJECTED, the guard worked
          # as intended" - the reassuring message, for the one case that had
          # not happened. The script now exits 2 when it never reached a
          # comparison, which is what makes this branch real.
          #
          # Every branch keys off the EXIT CODE first and the directory
          # second. The other order would let a crash that happened to leave
          # files behind report itself as a promotion.
          if ($code -eq '0' -and $models -gt 0) {
            $result = 'promoted'
          } elseif ($code -eq '0') {
            $result = 'nothing'
          } elseif ($code -eq '1') {
            $result = 'gate_failed'
          } else {
            $result = 'error'
          }

          Write-Host "candidate models written: $models, script exit code: $code -> $result"
          "result=$result" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract the comparison table
        if: steps.outcome.outputs.result != 'error'
        shell: powershell
        run: |
          # The gate's own table is the artefact worth surfacing, so it is
          # lifted verbatim rather than re-rendered.
          $lines = Get-Content retrain-output.txt
          $gate = $lines | Select-String -SimpleMatch 'PROMOTION GATE' | Select-Object -First 1

          if ($gate) {
            $end = $lines | Select-String -SimpleMatch 'negative change' | Select-Object -First 1
            $last = if ($end) { $end.LineNumber - 1 } else { $lines.Count - 1 }
            $table = $lines[($gate.LineNumber - 1)..$last]
          } else {
            # No table when the run stopped at the new-data check.
            $start = $lines | Select-String -SimpleMatch 'NEW DATA CHECK' | Select-Object -First 1
            $from = if ($start) { $start.LineNumber - 1 } else { 0 }
            $to = [Math]::Min($from + 14, $lines.Count - 1)
            $table = $lines[$from..$to]
          }

          $table | Out-File -FilePath table.txt -Encoding utf8
          Get-Content table.txt

      - name: Report - nothing to do
        if: steps.outcome.outputs.result == 'nothing'
        shell: powershell
        run: |
          $summary = @(
            '### Continuous retraining: nothing to do',
            '',
            'Not enough new games since the models were last trained.',
            'This is the expected result for most of the year.',
            '',
            '```'
          )
          $summary += Get-Content table.txt
          $summary += '```'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Report - the gate refused
        if: steps.outcome.outputs.result == 'gate_failed'
        shell: powershell
        run: |
          # THE JOB STILL SUCCEEDS. A refusal means the guard worked. Failing
          # the run would put a red X on a correct outcome, and a job that is
          # routinely red is a job people stop reading.
          $summary = @(
            '### Continuous retraining: candidate REJECTED',
            '',
            'A retrained model regressed against production on the same',
            'fresh test window. Nothing was promoted and no PR was opened.',
            '',
            '```'
          )
          $summary += Get-Content table.txt
          $summary += '```'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "::warning::Retraining produced a regression - see the run summary."

      - name: Open a pull request with the promoted models
        if: steps.outcome.outputs.result == 'promoted'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $branch = "retrain/$today"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $branch

          # The candidates become the shipped models, so the PR is a
          # mergeable change rather than a pile of files to move by hand.
          Copy-Item 'ml-training/models_candidate/*.json' 'ml-training/models/' -Force

          # AND the data they were trained on. A PR carrying new weights on
          # top of data that was never committed would not be reproducible -
          # nobody could rebuild these models from the merged state.
          #
          # Named explicitly, never `git add -A`: CLAUDE.md lives in this
          # working tree untracked and must not be swept in.
          git add ml-training/models/*.json
          git add ml-training/models/trained_through.json
          git add data-pipeline/data/processed/games_final.csv
          git add data-pipeline/data/processed/player_boxscores_with_rolling.csv

          git commit -m "Retrain team-level models on data through $today"
          git push origin $branch

          $body = @(
            'Automated retrain. The gate passed on all seven targets.',
            '',
            "Production below is the shipped architecture **re-fit on the",
            "candidate's own training rows** - not the deployed weights,",
            'which were trained on the whole dataset and would be scored',
            'on their own training data.',
            '',
            '```'
          )
          $body += Get-Content table.txt
          $body += @('```', '', 'Merging this deploys the new models. Review the table first.')
          $body | Out-File -FilePath pr-body.md -Encoding utf8

          gh pr create --title "Retrain: models through $today" --body-file pr-body.md --base main --head $branch

      - name: Fail the run only on a genuine error
        if: steps.outcome.outputs.result == 'error'
        shell: powershell
        run: |
          $code = '${{ steps.retrain.outputs.exit_code }}'
          Write-Host "continuous_retrain.py exited $code - it never reached a verdict."
          Write-Host "NOTHING was measured about model quality. This is not a regression."
          Write-Host ""
          if (Test-Path retrain-output.txt) {
            Get-Content retrain-output.txt -Tail 50
          } else {
            Write-Host "No retrain-output.txt - the script failed before producing any."
          }

          $summary = @(
            '### Continuous retraining: SCRIPT ERROR',
            '',
            "The retrain script exited ``$code`` without completing a",
            'comparison. No candidate was trained and no verdict was reached,',
            'so this says nothing about whether the models are still good -',
            'it is a broken job, not a rejected model.',
            '',
            'See the step log for the traceback.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          exit 1
