spring.application.name=basketball-predictor
spring.datasource.url=jdbc:postgresql://localhost:5432/basketball_predictor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# No implicit session during serialization. Any code path that forgets to
# load what it needs fails with LazyInitializationException instead of
# working by accident.
spring.jpa.open-in-view=false

inference.service.url=http://localhost:8000

# Without this a 400 arrives with no reason, so the caller can't tell an
# unknown team from a date the inference service refused.
spring.web.error.include-message=always