spring.application.name=basketball-predictor
# Host is overridable so the same jar runs on the host and in a container,
# where localhost would mean the container itself. Defaults to localhost, so
# nothing changes for local runs.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/basketball_predictor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# No implicit session during serialization. Any code path that forgets to
# load what it needs fails with LazyInitializationException instead of
# working by accident.
spring.jpa.open-in-view=false

# Same reason as DB_HOST above.
inference.service.url=${INFERENCE_URL:http://localhost:8000}

# Without this a 400 arrives with no reason, so the caller can't tell an
# unknown team from a date the inference service refused.
spring.web.error.include-message=always

# The browser origin allowed by CORS. Overridable for the same reason as
# DB_HOST and INFERENCE_URL, though under compose it stays localhost:3000 -
# that is the address the browser uses, not an internal service name.
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}
